<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
  :root{
    --paper: #0e0f14;
    --paper-raised: #16171e;
    --paper-raised-2: #1d1f29;
    --ink: #f1f0ea;
    --ink-soft: #b6b8c2;
    --ink-faint: #7e8190;
    --rule: #262834;
    --accent: #b7a6ff;
    --accent-soft: #d2c4ff;
    --accent-tint: #231f3d;
    --accent-tint-2: #2e2852;
    --teal: #5fd0b5;
    --teal-tint: #122e29;
    --serif: "Newsreader", "Iowan Old Style", ui-serif, Georgia, serif;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --maxw: 900px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; color-scheme: dark;}
  ::selection{ background: var(--accent-tint-2); color: #fff; }
  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  /* subtle grain / glow */
  body::before{
    content:"";
    position:fixed; inset:0;
    background: radial-gradient(700px 320px at 20% 0%, rgba(183,166,255,.09), transparent 60%),
                radial-gradient(600px 300px at 90% 10%, rgba(95,208,181,.07), transparent 60%);
    pointer-events:none; z-index:0;
  }
  main, header, footer{ position:relative; z-index:1; }
  a{ color: inherit; }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:2px; }
  .wrap{ max-width: var(--maxw); margin:0 auto; padding:0 28px; }
  h1,h2,h3{ font-family: var(--serif); font-weight:500; color:var(--ink); margin:0; }
  em{ font-style:italic; color:var(--accent); }

  header.nav{
    position:sticky; top:0; z-index:20;
    background: rgba(14,15,20,.86);
    backdrop-filter: saturate(140%) blur(10px);
    border-bottom:1px solid var(--rule);
  }
  .nav-inner{ max-width:1700px; margin:0 auto; padding:16px 28px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .nav-mark{ font-family:var(--serif); font-style:italic; font-size:17px; color:var(--ink); text-decoration:none; white-space:nowrap; }
  .nav-links{ display:flex; gap:17px; flex-wrap:nowrap; align-items:center; white-space:nowrap; font-family:var(--mono); font-size:11.5px; letter-spacing:.035em; }
  .nav-links a{ text-decoration:none; color:var(--ink-soft); padding-bottom:2px; border-bottom:1px solid transparent; transition:border-color .15s ease,color .15s ease; }
  .nav-links a:hover{ color:var(--ink); border-color:var(--accent); }

  .hero{ padding:76px 0 64px; }
  .hero-grid{ display:grid; grid-template-columns:1.15fr .85fr; gap:40px; align-items:center; }
  .hero h1{ font-size:clamp(30px,4.4vw,42px); line-height:1.22; letter-spacing:-.01em; }
  .hero .role{ margin-top:8px; color:var(--ink-soft); font-size:14.5px; font-family:var(--mono); letter-spacing:.01em; }
  .hero p.lede{ margin-top:22px; font-size:16.5px; color:var(--ink-soft); max-width:46ch; }
  .hero p.lede + p.lede{ margin-top:14px; }
  .pill{
    display:inline-flex; align-items:center; gap:8px; margin-top:26px; padding:8px 14px;
    border:1px solid var(--rule); border-radius:999px; background:var(--paper-raised);
    font-family:var(--mono); font-size:12.5px; color:var(--ink-soft);
  }
  .pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--teal); box-shadow:0 0 0 3px var(--teal-tint); flex-shrink:0; }

  .figures{ display:flex; flex-direction:column; gap:26px; }
  .figure{ position:relative; max-width:230px; margin:0 auto; background:var(--paper-raised); border:1px solid var(--rule); border-radius:10px; padding:14px 14px 10px; }
  .figure svg{ width:100%; height:auto; display:block; }
  .figure .cap{ margin-top:9px; font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); text-align:center; letter-spacing:.03em; }
  .fold-line{ fill:none; stroke:var(--accent); stroke-width:1.1; stroke-linecap:round; stroke-dasharray:400; stroke-dashoffset:400; animation:draw 1.9s ease forwards; }
  .fold-line.teal{ stroke:var(--teal); }
  .fold-line.dim{ stroke:var(--ink-faint); }
  .fold-dot{ opacity:0; animation:fadein .6s ease forwards; }
  circle.fold-dot{ fill:var(--ink); }
  .fold-label{ font-family:var(--mono); font-size:9.5px; fill:var(--ink-faint); }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes fadein{ to{ opacity:1; } }
  .fold-dot.d1{ animation-delay:.4s; } .fold-dot.d2{ animation-delay:.9s; } .fold-dot.d3{ animation-delay:1.4s; } .fold-dot.d4{ animation-delay:1.8s; }
  .fold-pulse{ animation:pulse 3.2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  section{ padding:56px 0; border-top:1px solid var(--rule); }
  section .head{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:30px; }
  section h2{ font-size:22px; letter-spacing:-.01em; }
  section .head .note{ font-family:var(--mono); font-size:12px; color:var(--ink-faint); text-align:right; }
  .intro-copy{ color:var(--ink-soft); max-width:58ch; margin:-12px 0 28px; font-size:15px; }

  .map-callout{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin:0 0 26px; padding:14px 18px; border:1px solid var(--rule); border-radius:8px; background:var(--paper-raised); }
  .map-callout .txt{ font-size:13.5px; color:var(--ink-soft); }
  .map-callout .txt strong{ color:var(--ink); font-weight:500; }
  .map-callout a.project-link{ margin-top:0; white-space:nowrap; }

  .reveal{ opacity:0; transform:translateY(10px); transition:opacity .6s ease, transform .6s ease; }
  .reveal.in{ opacity:1; transform:translateY(0); }

  .glossary{ columns:2; column-gap:36px; }
  .glossary-item{ display:flex; gap:12px; align-items:baseline; padding:10px 0; border-bottom:1px solid var(--rule); break-inside:avoid; }
  .glossary-item .n{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); flex-shrink:0; width:20px; }
  .glossary-item .t{ font-size:14.5px; color:var(--ink); }
  .glossary-item .t a{ color:var(--ink); text-decoration:none; transition:color .15s ease; }
  .glossary-item .t a:hover{ color:var(--accent); }

  .project{ padding:26px 0; border-top:1px solid var(--rule); }
  .project:first-child{ border-top:none; padding-top:0; }
  .project-top{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .project h3{ font-size:19px; }
  .project h3 a{ text-decoration:none; }
  .project h3 a:hover{ color:var(--accent); }
  .project .kind{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); white-space:nowrap; }
  .project p{ margin:10px 0 14px; color:var(--ink-soft); font-size:14.75px; max-width:62ch; }
  .tags{ display:flex; flex-wrap:wrap; gap:8px; }
  .tag{ font-family:var(--mono); font-size:11px; padding:4px 9px; border-radius:4px; background:var(--teal-tint); color:var(--teal); border:1px solid rgba(95,208,181,.22); }
  .project-link{ display:inline-block; margin-top:14px; font-family:var(--mono); font-size:12.5px; text-decoration:none; color:var(--accent); border-bottom:1px solid var(--accent-tint-2); }
  .project-link:hover{ border-color:var(--accent); }

  .architecture-study{ padding:26px 0 30px; border-top:1px solid var(--rule); }
  .architecture-study:first-of-type{ border-top:none; padding-top:0; }
  .architecture-study-top{ display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; }
  .architecture-study-top h3{ font-size:19px; }
  .architecture-study-top span{ font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; }
  .architecture-study p{ margin:10px 0 16px; color:var(--ink-soft); font-size:14.5px; max-width:58ch; }
  .architecture-flow{ display:flex; flex-wrap:wrap; align-items:center; gap:5px; margin:14px 0; font-family:var(--mono); font-size:10px; color:var(--ink-soft); }
  .architecture-flow span{ padding:4px 7px; border:1px solid var(--rule); background:var(--paper-raised); border-radius:4px; }
  .architecture-flow b{ color:var(--accent); font-weight:500; }
  .architecture-tags{ display:flex; flex-wrap:wrap; gap:7px; }
  .architecture-tags span{ font-family:var(--mono); font-size:10px; padding:4px 8px; border-radius:4px; background:var(--accent-tint); color:var(--accent); border:1px solid rgba(183,166,255,.22); }
  .architecture-link{ display:inline-block; margin-top:14px; font-family:var(--mono); font-size:12px; text-decoration:none; color:var(--accent); border-bottom:1px solid var(--accent-tint-2); }
  .architecture-link:hover{ border-color:var(--accent); }

  .log-item{ display:grid; grid-template-columns:96px 1fr; gap:18px; padding:18px 0; border-top:1px solid var(--rule); }
  .log-item:first-child{ border-top:none; padding-top:0; }
  .log-date{ font-family:var(--mono); font-size:11.5px; color:var(--ink-faint); padding-top:3px; }
  .log-item h3{ font-size:16.5px; font-weight:500; }
  .log-item a{ text-decoration:none; }
  .log-item a:hover h3{ color:var(--accent); }
  .log-item p{ margin:6px 0 0; color:var(--ink-soft); font-size:14px; }

  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:30px; }
  .stat{ border-top:2px solid var(--ink); padding-top:12px; }
  .stat .num{ font-family:var(--serif); font-size:32px; font-style:italic; color:var(--accent); }
  .stat .lab{ margin-top:2px; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); }
  .ctf-links{ display:flex; flex-direction:column; gap:8px; font-size:14.5px; }
  .ctf-links a{ color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-tint-2); }
  .ctf-links a:hover{ border-color:var(--accent); }
  .ctf-links span{ color:var(--ink-soft); }

  .contact-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:18px 32px; }
  .contact-row{ display:flex; flex-direction:column; gap:4px; padding-bottom:14px; border-bottom:1px solid var(--rule); }
  .contact-row .k{ font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); }
  .contact-row .v{ font-size:15.5px; }
  .contact-row .v a{ text-decoration:none; color:var(--ink); }
  .contact-row .v a:hover{ color:var(--accent); }

  footer{ padding:40px 0 60px; text-align:center; font-family:var(--mono); font-size:11.5px; color:var(--ink-faint); letter-spacing:.03em; }

  @media (max-width:780px){
    .hero-grid{ grid-template-columns:1fr; gap:34px; }
    .figures{ order:-1; flex-direction:row; flex-wrap:wrap; justify-content:center; gap:16px; }
    .figure{ max-width:170px; flex:1 1 150px; }
    .glossary{ columns:1; }
    .stats{ grid-template-columns:repeat(3,1fr); gap:12px; }
    .contact-grid{ grid-template-columns:1fr; }
    .nav-links{ gap:12px; flex-wrap:wrap; white-space:normal; overflow-x:auto; }
    .log-item{ grid-template-columns:1fr; gap:4px; }
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    .fold-line,.fold-dot,.fold-pulse,.reveal{ animation:none!important; transition:none!important; opacity:1!important; stroke-dashoffset:0!important; transform:none!important; }
  }
</style></head><body><main><section><div class="hero-grid"><div class="figures">
        <!-- fig 1: IoU -->
        <div class="figure" aria-hidden="true">
          <svg viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg">
            <rect x="30" y="30" width="90" height="70" fill="none" stroke="var(--teal)" stroke-width="1.2" class="fold-dot d1" />
            <rect x="70" y="50" width="90" height="70" fill="rgba(183,166,255,.14)" stroke="var(--accent)" stroke-width="1.2" class="fold-dot d2" />
            <rect x="70" y="50" width="50" height="50" fill="rgba(95,208,181,.22)" stroke="var(--teal)" stroke-width="1" stroke-dasharray="3,3" class="fold-dot d3" />
            <circle class="fold-dot d1" cx="30" cy="30" r="2.5" />
            <circle class="fold-dot d2" cx="160" cy="120" r="2.5" />
            <text class="fold-label" x="28" y="22">pred</text>
            <text class="fold-label" x="140" y="135">gt</text>
            <text class="fold-label" x="74" y="78" style="fill:var(--teal);">IoU</text>
            <path class="fold-line teal" d="M30 130 H190" style="animation-delay:.2s;" />
          </svg>
          <div class="cap">fig. 1 — box overlap: IoU = |A∩B| / |A∪B|</div>
        </div>

        <!-- fig 2: feature pyramid -->
        <div class="figure" aria-hidden="true">
          <svg viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg">
            <rect class="fold-dot d1" x="20" y="25" width="60" height="100" rx="2" fill="none" stroke="var(--ink-faint)" stroke-width="1" />
            <rect class="fold-dot d2" x="90" y="40" width="45" height="70" rx="2" fill="none" stroke="var(--teal)" stroke-width="1.1" />
            <rect class="fold-dot d2 fold-pulse" x="145" y="55" width="30" height="40" rx="2" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.1" />
            <path class="fold-line" d="M80 60 L90 60 M135 60 L145 60 M80 90 L90 90 M135 90 L145 90" style="stroke-width:.9;" />
            <path class="fold-line teal" d="M175 55 V95 M165 75 H185" style="animation-delay:.6s;" />
            <text class="fold-label" x="20" y="18">P3</text>
            <text class="fold-label" x="90" y="33">P4</text>
            <text class="fold-label" x="145" y="48">P5</text>
          </svg>
          <div class="cap">fig. 2 — multi-scale features: P3 → P5</div>
        </div>

        <!-- fig 3: detection pipeline -->
        <div class="figure" aria-hidden="true">
          <svg viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg">
            <path class="fold-line" d="M12 30 H208" />
            <circle class="fold-dot d1" cx="20" cy="30" r="2.4"/><circle class="fold-dot d1" cx="80" cy="30" r="2.4"/><circle class="fold-dot d1" cx="140" cy="30" r="2.4"/><circle class="fold-dot d1" cx="200" cy="30" r="2.4"/>
            <text class="fold-label" x="204" y="22">L0</text>
            <path class="fold-line" d="M20 30 L55 70 M80 30 L55 70 M140 30 L155 70 M200 30 L155 70" style="stroke-width:.8; opacity:.8;" />
            <path class="fold-line teal" d="M55 70 H155" style="animation-delay:.5s;" />
            <circle class="fold-dot d2" cx="55" cy="70" r="2.2"/><circle class="fold-dot d2" cx="155" cy="70" r="2.2"/>
            <text class="fold-label" x="161" y="65">NMS</text>
            <path class="fold-line" d="M55 70 L105 105 M155 70 L105 105" style="stroke-width:.8; opacity:.8; animation-delay:.9s;" />
            <circle class="fold-dot d3 fold-pulse" cx="105" cy="105" r="3" style="animation-delay:1.3s;"/>
            <text class="fold-label" x="113" y="101">track</text>
            <path class="fold-line" d="M105 112 V130" style="stroke-width:.8; animation-delay:1.5s;" />
            <rect class="fold-dot d4" x="85" y="130" width="40" height="16" rx="2" fill="none" stroke="var(--ink)" stroke-width="1.1" style="animation-delay:1.7s;"/>
            <text class="fold-label" x="105" y="142" text-anchor="middle" style="fill:var(--ink);">deploy</text>
          </svg>
          <div class="cap">fig. 3 — detect → NMS → track → deploy</div>
        </div>
      </div>
    </div>
  </section>
</section>
  <section id="fundamentals"></section></main></body></html>
